<div class="rule-editor">
  <details class="team-section" data-rule-section="common">
    <summary>全体共通</summary><div class="scope-body">
      {% for key,label in [('self-vote','自投票'),('abstention','無投票')] %}<label class="exclusive-field inactive-item" for="{{ key }}">{{ label }}<select id="{{ key }}" disabled><option value="">—</option><option>あり</option><option>なし</option></select></label>{% endfor %}
    </div>
  </details>
  <details class="team-section" data-rule-section="village">
    <summary>村陣営</summary>
    <details class="scope-section" data-rule-role="seer"><summary>占い師</summary><div class="scope-body"><label class="exclusive-field" for="{{ 'first-seer' if editable else 'view-first-seer' }}">初日占い<select id="{{ 'first-seer' if editable else 'view-first-seer' }}" {% if editable %}name="initial_seer"{% else %}disabled{% endif %}>{% for value,label in [('normal','あり'),('random_white','ランダム白'),('none','なし')] %}<option value="{{ value }}" {% if (editable and draft.initial_seer==value) or (not editable and rules.initial_seer==value) %}selected{% endif %}>{{ label }}</option>{% endfor %}{% if editable and draft.initial_seer not in ('normal','random_white','none') %}<option value="{{ draft.initial_seer }}" selected>不正な値：{{ draft.initial_seer }}</option>{% endif %}</select></label></div></details>
    <details class="scope-section" data-rule-role="hunter"><summary>狩人（能力なし）</summary><div class="scope-body"><label class="exclusive-field inactive-item" for="repeat-guard">連続ガード<select id="repeat-guard" disabled><option value="">—</option><option>あり</option><option>なし</option></select></label></div></details>
  </details>
  <details class="team-section" data-rule-section="wolf">
    <summary>狼陣営</summary><div class="scope-body">
      <label class="exclusive-field" for="{{ 'allow-self-bite' if editable else 'view-self-bite' }}">自噛み<select id="{{ 'allow-self-bite' if editable else 'view-self-bite' }}" {% if editable %}name="allow_self_bite"{% else %}disabled{% endif %}><option value="0" {% if (editable and draft.allow_self_bite == '0') or (not editable and not rules.allow_self_bite) %}selected{% endif %}>不可</option><option value="1" {% if (editable and draft.allow_self_bite == '1') or (not editable and rules.allow_self_bite) %}selected{% endif %}>可能</option>{% if editable and draft.allow_self_bite not in ('0','1') %}<option value="{{ draft.allow_self_bite }}" selected>不正な値：{{ draft.allow_self_bite }}</option>{% endif %}</select></label>
    </div>
  </details>
</div>
