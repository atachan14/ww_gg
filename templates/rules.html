<div class="rule-editor">
  <details class="team-section" data-rule-section="common">
    <summary>全体共通</summary><div class="scope-body">
      {% for key,label in [('self-vote','自投票'),('abstention','無投票')] %}<label class="exclusive-field inactive-item" for="{{ key }}">{{ label }}<select id="{{ key }}" disabled><option value="">—</option><option>あり</option><option>なし</option></select></label>{% endfor %}
    </div>
  </details>
  <details class="team-section" data-rule-section="village">
    <summary>村陣営</summary>
    <details class="scope-section" data-rule-role="seer"><summary>占い師（能力なし）</summary><div class="scope-body"><label class="exclusive-field inactive-item" for="first-seer">初日占い<select id="first-seer" disabled><option value="">—</option><option>あり</option><option>ランダム白</option><option>なし</option></select></label></div></details>
    <details class="scope-section" data-rule-role="hunter"><summary>狩人（能力なし）</summary><div class="scope-body"><label class="exclusive-field inactive-item" for="repeat-guard">連続ガード<select id="repeat-guard" disabled><option value="">—</option><option>あり</option><option>なし</option></select></label></div></details>
  </details>
  <details class="team-section" data-rule-section="wolf">
    <summary>狼陣営</summary><div class="scope-body">
      <label class="exclusive-field" for="{{ 'allow-self-bite' if editable else 'view-self-bite' }}">自噛み<select id="{{ 'allow-self-bite' if editable else 'view-self-bite' }}" {% if editable %}name="allow_self_bite"{% else %}disabled{% endif %}><option value="0" {% if editable or not rules.allow_self_bite %}selected{% endif %}>不可</option><option value="1" {% if not editable and rules.allow_self_bite %}selected{% endif %}>可能</option></select></label>
    </div>
  </details>
</div>
