{% if report_opportunities %}<section class="panel"><h2>霊能申告</h2><div class="table-scroll"><table class="player-table"><thead><tr><th>公開日</th><th>霊CO者</th><th>処刑対象</th><th>申告</th></tr></thead><tbody>{% for day,reporter,target in report_opportunities %}<tr><td>Day {{ day }}</td><td>Player {{ reporter }}</td><td>Player {{ target }}</td><td><select class="report-select" name="report_{{ day }}_{{ reporter }}_{{ target }}" aria-label="Day {{ day }} Player {{ reporter }}によるPlayer {{ target }}の霊能申告">{% for value,label in [('','未入力'),('white','白'),('black','黒')] %}<option value="{{ value }}" {% if report_colors.get((day,reporter,target),'')==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></td></tr>{% endfor %}</tbody></table></div></section>{% endif %}
