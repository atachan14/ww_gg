<button type="button" class="board-log-add" data-dawn-open>{{ '朝の報告を編集' if observation is not none else '朝の報告を追加' }}</button>
<dialog class="board-log-dialog dawn-report-editor" id="dawn-report-dialog" aria-labelledby="dawn-report-title">
  <div class="overlay-shell"><header class="overlay-head"><h2 id="dawn-report-title">朝の報告</h2><button type="button" data-dawn-close aria-label="閉じる">×</button></header><div class="overlay-body"><div class="dawn-report-fields">
    <input type="hidden" name="revision" value="{{ state.revision }}" form="dawn-report-form">
    <input type="hidden" name="board_id" value="{{ state.public_log.board_id }}" form="dawn-report-form">
    <label><input type="radio" name="mode" value="deaths" form="dawn-report-form" {% if observation is none or observation.deaths %}checked{% endif %}> 死体あり</label>
    <div class="dawn-corpses">{% for p in board.alive %}<label><input type="checkbox" name="deaths" value="{{ p }}" form="dawn-report-form" {% if observation and p in observation.deaths %}checked{% endif %}> Player{{ p }}</label>{% endfor %}</div>
    <label><input type="radio" name="mode" value="none" form="dawn-report-form" {% if observation is not none and not observation.deaths %}checked{% endif %}> 死体なし</label>
    <button type="submit" form="dawn-report-form">確認</button>
  </div></div>
</dialog>
{% if observation is not none %}
<input type="hidden" name="revision" value="{{ state.revision }}" form="dawn-clear-form">
<input type="hidden" name="board_id" value="{{ state.public_log.board_id }}" form="dawn-clear-form">
<input type="hidden" name="mode" value="clear" form="dawn-clear-form">
<button type="submit" class="secondary" form="dawn-clear-form">朝の報告を削除</button>
{% endif %}
