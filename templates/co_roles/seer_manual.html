<div data-seer-manual="{{ player.id }}">{% for entry in player.seer_timeline %}<span class="field-label">Day {{ entry.day }}{% if entry.initial_none %}：初日取得なし{% else %}：<select class="report-select" name="seer_target_{{ entry.day }}_{{ player.id }}" aria-label="Player {{ player.id }} Day {{ entry.day }} 占い対象" {% if public_readonly or not entry.editable %}disabled{% endif %}><option value="">対象未入力</option>{% for target in entry.targets %}<option value="{{ target }}" {% if entry.target==target %}selected{% endif %}>Player {{ target }}</option>{% endfor %}</select><select class="report-select" name="seer_color_{{ entry.day }}_{{ player.id }}" aria-label="Player {{ player.id }} Day {{ entry.day }} 占い結果" {% if public_readonly or not entry.editable %}disabled{% endif %}><option value="">結果未入力</option><option value="white" {% if entry.color=='white' %}selected{% endif %}>白</option><option value="black" {% if entry.color=='black' %}selected{% endif %}>黒</option></select>{% endif %}</span>{% endfor %}</div>
