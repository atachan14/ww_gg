<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameTree コンパクト比較</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9f8;color:#21352f;font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1600px;padding:20px;margin:auto}h1{font-size:17px;margin:0 0 3px}p{margin:0}.fixture{color:#62776e;font-size:12px}.variants{display:grid;gap:18px;margin-top:18px;grid-template-columns:1fr 1fr}section{min-width:0;background:white;border-radius:8px;border:1px solid #e0e7e3;padding:12px}h2{font-size:13px;margin:0 0 6px;font-weight:600}.scroll{overflow:auto;max-width:100%}.canvas{position:relative;min-width:640px;height:284px}.phase{position:absolute;top:0;width:142px;text-align:left;font-size:12px;color:#566c62;padding:6px 0;border-bottom:1px solid #dce5df}.item{position:absolute;z-index:1;width:142px;height:27px;padding:3px 7px;font:12px/19px system-ui,sans-serif;text-align:left;color:#21352f;white-space:nowrap;cursor:pointer;border:1px solid #a8bdb2;border-radius:4px;background:#fff}.item:focus-visible{outline:2px solid #20765d;outline-offset:3px}.item[aria-pressed=true]{background:#e8f2ec;color:#14614b}.item.win{color:#12674f}.item.loss{color:#86523f}.borderless .item{border-color:transparent;border-radius:0}.borderless .item:hover{background:#f0f5f1}.outline .item:hover{border-color:#20765d}.value{font-weight:650}.canvas svg{position:absolute;inset:0;pointer-events:none;overflow:visible}.edge{position:absolute;font-size:10px;color:#5f786c;background:#fff;padding:0 3px;white-space:nowrap;z-index:2}.inspect{min-height:22px;color:#62776e;font-size:11px;border-top:1px solid #edf1ee;padding-top:7px;white-space:normal} @media(max-width:1100px){.variants{grid-template-columns:1fr}}@media(max-width:500px){main{padding:12px}section{padding:9px}.variants{gap:12px;margin-top:12px}.canvas{height:284px}}
</style>
<main><h1>GameTree</h1><p class="fixture">市民3・占い1・狼1 · 全潜伏 · 昼夜MAX</p><p class="fixture">項目：村勝率　／　矢印：枝の確率</p><div class="variants"><section class="outline" data-variant="A"><h2>A　細い枠</h2><div class="scroll"><div class="canvas"></div></div><p class="inspect">—</p></section><section class="borderless" data-variant="B"><h2>B　枠なし</h2><div class="scroll"><div class="canvas"></div></div><p class="inspect">—</p></section></div></main>
<script type="application/json" id="sample">SAMPLE_JSON</script>
<script>
'use strict';const sample=JSON.parse(document.querySelector('#sample').textContent),byId=new Map(sample.nodes.map(n=>[n.node,n]));
function pick(id){const n=byId.get(id),incoming=sample.edges.find(e=>e.target===id),history=n.history.map(h=>`${h.phase==='day'?'処刑':'襲撃'}P${h.target}`).join(' → '),members=incoming? [...new Set(incoming.members.map(m=>'B'+m.node))].join(' / '):'';document.querySelectorAll('.item').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.board===id)));document.querySelectorAll('.inspect').forEach(line=>line.textContent=`B${id} · 生存 ${n.alive.map(p=>'P'+p).join(' ')}${history?' · '+history:''}${members?' · 同型 '+members:''}`);}
for(const section of document.querySelectorAll('section')){
 const canvas=section.querySelector('.canvas'),positions=new Map(),counts=new Map();
 for(let phase=0;phase<4;phase++){const h=document.createElement('div');h.className='phase';h.textContent=`Day${Math.floor(phase/2)+1}${phase%2?'夜':'昼'}`;h.style.left=(phase*166+4)+'px';canvas.append(h);}
 for(const n of sample.nodes){const phase=(n.day-1)*2+(n.phase==='night'?1:0),row=counts.get(phase)||0;counts.set(phase,row+1);const pos={x:phase*166+4,y:49+row*76};positions.set(n.node,pos);const item=document.createElement('button');item.className='item '+(n.winner==='village'?'win':n.winner==='wolf'?'loss':'');item.type='button';item.dataset.board=n.node;item.dataset.phase=`${n.day}-${n.phase}`;item.setAttribute('aria-pressed','false');item.style.left=pos.x+'px';item.style.top=pos.y+'px';item.append(document.createTextNode(`B${n.node} · ${n.alive.length}人 · 村 `));const value=document.createElement('span');value.className='value';value.textContent=n.village_win;item.append(value);item.onclick=()=>pick(n.node);canvas.append(item);}
 const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('width','640');svg.setAttribute('height','284');const defs=document.createElementNS(ns,'defs'),marker=document.createElementNS(ns,'marker');marker.id='arrow-'+section.dataset.variant;for(const[k,v]of Object.entries({viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'5',markerHeight:'5',orient:'auto'}))marker.setAttribute(k,v);const tip=document.createElementNS(ns,'path');tip.setAttribute('d','M0 0 L10 5 L0 10 Z');tip.setAttribute('fill','#94aa9e');marker.append(tip);defs.append(marker);svg.append(defs);
 for(const e of sample.edges){const a=positions.get(e.source),b=positions.get(e.target),same=a.x===b.x;const path=document.createElementNS(ns,'path');const x=a.x+142,y=a.y+13,u=same?b.x+130:b.x,v=b.y+13;path.setAttribute('d',same?`M${x},${y} H${x+9} V${v} H${u}`:`M${x},${y} H${x+12} V${v} H${u}`);path.setAttribute('fill','none');path.setAttribute('stroke','#94aa9e');path.setAttribute('marker-end',`url(#arrow-${section.dataset.variant})`);svg.append(path);const label=document.createElement('span');label.className='edge';label.textContent=`${e.action}${e.multiplicity>1?' ×'+e.multiplicity:''} · ${e.probability}`;label.style.left=(same?b.x+5:b.x+2)+'px';label.style.top=(b.y-20)+'px';canvas.append(label);}
 canvas.prepend(svg);
}
</script></html>
