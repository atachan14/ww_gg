{% extends "base.html" %}

{% block content %}
<div id="main-content-root">
    {% include "_main_page_content.html" %}
</div>

<script>
window.initMainPageInteractions = function initMainPageInteractions() {
    const root = document.getElementById('main-content-root');
    if (!root) {
        return;
    }

    const form = root.querySelector('#main-advance-form');
    const actionInput = root.querySelector('#main-action');
    const advanceButton = root.querySelector('#advance-button');
    const targetRadios = Array.from(root.querySelectorAll('input[name="selected_target"]'));
    const coToggles = Array.from(root.querySelectorAll('[data-co-toggle]'));
    const coRows = Array.from(root.querySelectorAll('[data-co-row]'));
    const viewToggleButtons = Array.from(root.querySelectorAll('[data-view-key]'));
    const tacticSelects = Array.from(root.querySelectorAll('.tactics-panel select[name]'));
    const treeForms = Array.from(root.querySelectorAll('.tree-grid-item'));
    const isTerminal = root.querySelector('.terminal-banner') !== null;

    async function renderPartial(response) {
        if (!response.ok) {
            window.location.reload();
            return;
        }
        root.innerHTML = await response.text();
        window.initMainPageInteractions();
    }

    async function submitPartial(formElement) {
        const response = await fetch(formElement.action, {
            method: 'POST',
            headers: { 'X-Partial-Update': '1' },
            body: new FormData(formElement),
        });
        await renderPartial(response);
    }

    function hasChecked() {
        return targetRadios.some((radio) => radio.checked);
    }

    function syncAdvanceButton() {
        if (advanceButton) {
            advanceButton.disabled = isTerminal || !hasChecked();
        }
    }

    function toggleCoRow(playerIndex) {
        coRows.forEach((row) => {
            if (row.dataset.coRow === playerIndex) {
                row.hidden = !row.hidden;
            } else {
                row.hidden = true;
            }
        });
    }

    if (form && actionInput) {
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            await submitPartial(form);
        });
    }

    targetRadios.forEach((radio) => {
        radio.addEventListener('change', async () => {
            if (!form || !actionInput) {
                return;
            }
            syncAdvanceButton();
            actionInput.value = 'tree';
            await submitPartial(form);
        });
    });

    root.querySelectorAll('[data-nav-action]').forEach((button) => {
        button.addEventListener('click', () => {
            if (actionInput) {
                actionInput.value = button.dataset.navAction || 'tree';
            }
        });
    });

    treeForms.forEach((treeForm) => {
        treeForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            await submitPartial(treeForm);
        });
    });

    coToggles.forEach((button) => {
        button.addEventListener('click', (event) => {
            event.stopPropagation();
            toggleCoRow(button.dataset.coToggle);
        });
    });

    document.addEventListener('click', () => {
        coRows.forEach((row) => {
            row.hidden = true;
        });
    }, { once: true });

    coRows.forEach((row) => {
        row.addEventListener('click', (event) => {
            event.stopPropagation();
        });
    });

    root.querySelectorAll('.co-selector input[type="checkbox"]').forEach((checkbox) => {
        checkbox.addEventListener('change', async () => {
            await fetch('/main/claims', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    player_index: Number(checkbox.name.split('_')[1]),
                    role_key: checkbox.name.split('_').slice(2).join('_'),
                    checked: checkbox.checked,
                }),
            });
            window.location.reload();
        });
    });

    viewToggleButtons.forEach((button) => {
        button.addEventListener('click', async () => {
            await fetch('/session/ui', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: button.dataset.viewKey, value: button.dataset.viewValue }),
            });
            window.location.reload();
        });
    });

    tacticSelects.forEach((select) => {
        select.addEventListener('change', async () => {
            await fetch('/main/tactics', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: select.name, value: select.value }),
            });
            window.location.reload();
        });
    });

    syncAdvanceButton();
};

document.addEventListener('DOMContentLoaded', () => {
    window.initMainPageInteractions();
});
</script>
{% endblock %}
